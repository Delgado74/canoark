name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_ARKADE_NETWORK: ${{ vars.ARKADE_NETWORK || 'mutinynet' }}
      EXPO_PUBLIC_LNURL_BASE_URL: ${{ vars.LNURL_BASE_URL }}
      EXPO_PUBLIC_LNURL_DOMAIN: ${{ vars.LNURL_DOMAIN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "ndk;27.1.12297006" > /dev/null

          SDK37=0
          if "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1; then
            SDK37=1
          elif "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1; then
            SDK37=1
          fi

          if [ "$SDK37" = "1" ]; then
            echo "Android SDK 37 installed"
            echo "ANDROID_COMPILE_SDK=37" >> "$GITHUB_ENV"
            echo "ANDROID_BUILD_TOOLS=37.0.0" >> "$GITHUB_ENV"
          else
            echo "::warning::android-37 is not available; compiling against 36 and disabling AAR compileSdk checks"
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" > /dev/null
            echo "ANDROID_COMPILE_SDK=36" >> "$GITHUB_ENV"
            echo "ANDROID_BUILD_TOOLS=36.1.0" >> "$GITHUB_ENV"
            echo "ANDROID_DISABLE_SDK_CHECKS=-Pandroid.experimental.disableCompileSdkChecks=true" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        run: node scripts/configure-android-signing.mjs

      - name: Increase Gradle wrapper timeout
        run: sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.compileSdkVersion="$ANDROID_COMPILE_SDK" \
            -Pandroid.buildToolsVersion="$ANDROID_BUILD_TOOLS" \
            ${ANDROID_DISABLE_SDK_CHECKS:-}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: canoark-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
