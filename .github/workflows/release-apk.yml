name: Build Android APK (release firmado)

on:
  workflow_dispatch:
    inputs:
      network:
        description: Red de Arkade compilada en el APK
        type: choice
        required: true
        default: mainnet
        options:
          - mainnet
          - mutinynet
      notes:
        description: Nota libre para identificar esta compilación
        type: string
        required: false

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPO_PUBLIC_ARKADE_NETWORK: ${{ inputs.network }}
      EXPO_PUBLIC_LNURL_BASE_URL: ${{ vars.LNURL_BASE_URL }}
      EXPO_PUBLIC_LNURL_DOMAIN: ${{ vars.LNURL_DOMAIN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNING_REQUIRED: '1'
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing secrets
        run: |
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de firma:$missing"
            echo "Configura los secrets en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secretos de firma presentes."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version || true

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "ndk;27.1.12297006" > /dev/null

          SDK37=0
          if "$SDKMANAGER" "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1; then
            SDK37=1
          elif "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;37.0.0" > /dev/null 2>&1; then
            SDK37=1
          fi

          if [ "$SDK37" = "1" ]; then
            echo "Android SDK 37 installed"
            echo "ANDROID_COMPILE_SDK=37" >> "$GITHUB_ENV"
            echo "ANDROID_BUILD_TOOLS=37.0.0" >> "$GITHUB_ENV"
          else
            echo "::warning::android-37 is not available; compiling against 36 and disabling AAR compileSdk checks"
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.1.0" > /dev/null
            echo "ANDROID_COMPILE_SDK=36" >> "$GITHUB_ENV"
            echo "ANDROID_BUILD_TOOLS=36.1.0" >> "$GITHUB_ENV"
            echo "ANDROID_DISABLE_SDK_CHECKS=-Pandroid.experimental.disableCompileSdkChecks=true" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        run: node scripts/configure-android-signing.mjs

      - name: Increase Gradle wrapper timeout
        run: sed -i 's/networkTimeout=10000/networkTimeout=120000/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.compileSdkVersion="$ANDROID_COMPILE_SDK" \
            -Pandroid.buildToolsVersion="$ANDROID_BUILD_TOOLS" \
            ${ANDROID_DISABLE_SDK_CHECKS:-}

      - name: Verify release signature
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$(command -v apksigner)"
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          if grep -qi 'CN=Android Debug' /tmp/apksigner.txt; then
            echo "::error::El APK está firmado con la clave de debug, no con la de release."
            exit 1
          fi

      - name: Rename APK
        run: |
          set -euo pipefail
          NAME="canoark-${{ inputs.network }}-v$(node -p "require('./app.json').expo.version")-code$(node -p "require('./app.json').expo.android.versionCode")-run${{ github.run_number }}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$NAME"
          echo "APK: dist/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: dist/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90
